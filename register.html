<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyper - Singup</title>
    <link rel="stylesheet" href="./css/stlye.css">
</head>
<body>
    <header class="login-leader">
        <h1>Skyper</h1>
        <p>Your Ledger Simplified..</p>
    </header>

    <main>
        <section class="login-container">
            <h2>Signup</h2>
            <form id="login-form">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" minlength="8" required>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" minlength="8" required>
                <p id="signup-error" class="error-message hidden"></p>
                <button type="submit">Login</button>
            </form>
            <p>Already have an account? <a href="./login.html">Login</a></p>
        </section>
    </main>

    <footer>
        <p>&copy;Skyper - Copyright Reserved</p>
    </footer>
    <script src="./js/main.js"></script>
</body>
</html>
